<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gilden · Pagina non trovata</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,700&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--ink:#0A0A0A;--paper:#FFFFFF;--soft:#3A3A3A;--mute:#666666;--line:#E3E3E3;--display:'Cormorant Garamond',Georgia,serif;--body:'Jost','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;display:flex;flex-direction:column;min-height:100vh}
header{border-bottom:1px solid var(--line);text-align:center;padding:22px 16px}
header a{font-family:var(--display);font-style:italic;font-weight:700;font-size:44px;color:var(--ink);text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.box{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(38px,6vw,56px);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;font-size:17px;line-height:1.7;color:var(--soft)}
.ref{font-size:14px;color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--paper);color:var(--ink)}
#nl-badge-frame{display:none!important}
footer{background:var(--ink);color:#8F8F8F;text-align:center;font-size:12px;letter-spacing:.14em;padding:24px 16px}
</style>
</head>
<body>
<header><a href="/">Gilden</a></header>
<main><div class="box">
<span class="eyebrow">404</span>
<h1>Pagina non trovata</h1>
<p>Esta página no existe. · Questa pagina non esiste.</p>
<div class="acts"><a class="btn" href="/">Volver a Gilden</a></div>
</div></main>
<footer>GILDEN · PROFUMI D’AUTORE</footer>
</body>
</html>
