<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gilden · Grazie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,700&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--ink:#0A0A0A;--paper:#FFFFFF;--soft:#3A3A3A;--mute:#666666;--line:#E3E3E3;--display:'Cormorant Garamond',Georgia,serif;--body:'Jost','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;display:flex;flex-direction:column;min-height:100vh}
header{border-bottom:1px solid var(--line);text-align:center;padding:22px 16px}
header a{font-family:var(--display);font-style:italic;font-weight:700;font-size:44px;color:var(--ink);text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.box{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(38px,6vw,56px);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;font-size:17px;line-height:1.7;color:var(--soft)}
.ref{font-size:14px;color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--paper);color:var(--ink)}
#nl-badge-frame{display:none!important}
footer{background:var(--ink);color:#8F8F8F;text-align:center;font-size:12px;letter-spacing:.14em;padding:24px 16px}
</style>
</head>
<body>
<header><a href="/">Gilden</a></header>
<main>
  <div class="box">
    <span class="eyebrow" id="eye"></span>
    <h1 id="title"></h1>
    <p id="text"></p>
    <span class="ref" id="ref" hidden></span>
    <div class="acts">
      <a class="btn" href="/" id="home"></a>
      <a class="btn ghost" href="#" id="wa" target="_blank" rel="noopener"></a>
    </div>
  </div>
</main>
<footer>© 2026 GILDEN · PROFUMI D’AUTORE</footer>
<script>
(function(){
  var WHATSAPP='5493535639474';
  var lang='it';try{lang=localStorage.getItem('gilden-lang')==='es'?'es':'it';}catch(e){}
  var q=new URLSearchParams(location.search);
  var estado=q.get('estado')||'ok';
  var ref=q.get('external_reference')||'';
  var T={
    it:{ok:['Ordine confermato','Grazie per il tuo acquisto','Abbiamo ricevuto il pagamento. Ti scriveremo su WhatsApp per concordare la spedizione.'],
        pendiente:['Pagamento in attesa','Il tuo pagamento è in elaborazione','Quando Mercado Pago lo approva, ti scriviamo su WhatsApp per la spedizione.'],
        error:['Pagamento non completato','Il pagamento non è andato a buon fine','Puoi riprovare dal carrello o scriverci su WhatsApp e ti aiutiamo.'],
        home:'Torna al negozio',wa:'Scrivici su WhatsApp',ref:'Numero d’ordine: ',msg:'Ciao! Ho fatto un ordine sul sito Gilden. '},
    es:{ok:['Pedido confirmado','Gracias por tu compra','Recibimos tu pago. Te vamos a escribir por WhatsApp para coordinar el envío.'],
        pendiente:['Pago pendiente','Tu pago se está procesando','Cuando Mercado Pago lo apruebe, te escribimos por WhatsApp para el envío.'],
        error:['Pago no completado','El pago no se pudo realizar','Podés intentar de nuevo desde el carrito o escribirnos por WhatsApp y te ayudamos.'],
        home:'Volver a la tienda',wa:'Escribinos por WhatsApp',ref:'Número de pedido: ',msg:'¡Hola! Hice un pedido en la web de Gilden. '}
  };
  var L=T[lang],m=L[estado]||L.ok;
  document.documentElement.lang=lang;
  document.getElementById('eye').textContent=m[0];
  document.getElementById('title').textContent=m[1];
  document.getElementById('text').textContent=m[2];
  document.getElementById('home').textContent=L.home;
  var w=document.getElementById('wa');w.textContent=L.wa;
  w.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(L.msg+(ref?L.ref+ref:''));
  if(ref){var r=document.getElementById('ref');r.textContent=L.ref+ref;r.hidden=false;}
  if(estado==='ok'||estado==='pendiente'){try{localStorage.removeItem('gilden-cart');}catch(e){}}
})();
</script>
</body>
</html>
